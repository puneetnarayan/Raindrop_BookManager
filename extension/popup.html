<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>BookManager Tab Saver</title>
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #171717;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 10px;
  }
  label.row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #525252;
    margin-bottom: 10px;
  }
  button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .primary {
    background: #ede9fe;
    color: #5b21b6;
  }
  .primary:hover {
    background: #ddd6fe;
  }
  .secondary {
    background: #f5f5f5;
    color: #404040;
    border: 1px solid #e5e5e5;
  }
  .secondary:hover {
    background: #e5e5e5;
  }
  #status {
    font-size: 11px;
    color: #737373;
    min-height: 14px;
    margin-top: 2px;
  }
  #status.ok {
    color: #059669;
  }
  a#options-link {
    display: block;
    text-align: center;
    font-size: 11px;
    color: #737373;
    margin-top: 8px;
    text-decoration: none;
  }
  a#options-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <h1>Save tabs to BookManager</h1>

  <label class="row">
    <input type="checkbox" id="allWindows" />
    Include all windows (not just this one)
  </label>

  <button class="primary" id="copyBtn">Copy all tab URLs</button>
  <button class="secondary" id="openBtn">Open Save Session</button>

  <p id="status"></p>

  <a id="options-link" href="#">Set app URL…</a>

  <script src="popup.js"></script>
</body>
</html>
