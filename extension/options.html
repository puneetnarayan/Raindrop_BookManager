<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>BookManager Tab Saver — Settings</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 420px;
    margin: 40px auto;
    color: #171717;
    padding: 0 16px;
  }
  h1 {
    font-size: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: #525252;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #d4d4d4;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  button {
    border: none;
    border-radius: 6px;
    background: #ede9fe;
    color: #5b21b6;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover {
    background: #ddd6fe;
  }
  p {
    font-size: 12px;
    color: #737373;
  }
  #saved {
    font-size: 12px;
    color: #059669;
    margin-left: 8px;
  }
</style>
</head>
<body>
  <h1>BookManager Tab Saver</h1>
  <p>Enter the URL of your deployed Raindrop BookManager app (e.g. your Vercel deployment URL).</p>
  <label for="appUrl">App URL</label>
  <input id="appUrl" type="url" placeholder="https://your-app.vercel.app" />
  <button id="saveBtn">Save</button>
  <span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
